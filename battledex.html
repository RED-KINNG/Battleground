<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07060f" />
  <title>BattleDex — Battleground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="battledex.css" />
</head>
<body>
  <div class="neon-floor" aria-hidden="true"></div>

  <header class="topbar">
    <a class="wordmark" href="index.html">BATTLEGROUND</a>
    <nav class="nav" aria-label="Main">
      <a class="chamfer" href="index.html">ARENA</a>
      <a class="chamfer" href="battledex.html" aria-current="page">BATTLEDEX</a>
    </nav>
  </header>

  <main class="dex-main">
    <section id="view-battledex" class="view-battledex">
      <div class="dex-hero">
        <div class="dex-heading">
          <span class="eyebrow">◢ COLLECTION</span>
          <h1 class="dex-title">BATTLEDEX</h1>
        </div>
        <p class="dex-count" id="roster-count-text">FIGHTERS <strong>000</strong></p>
      </div>

      <div class="dex-actions">
        <button id="battledex-back-to-fight" type="button" class="btn btn-ghost chamfer" hidden>&lt;&lt; LAST FIGHT</button>
        <a id="battledex-new-fight" href="index.html" class="btn btn-primary chamfer">NEW FIGHT &gt;&gt;</a>
      </div>

      <div id="battledex-grid" class="battledex-grid"></div>

      <div id="battledex-empty" class="battledex-empty" hidden>
        <div class="empty-panel chamfer">
          <div class="empty-inner chamfer">
            <div class="empty-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="9"/><rect x="3" y="15" width="7" height="6"/><path d="M17.5 14v7M14 17.5h7"/></svg>
            </div>
            <h2 class="empty-heading">NO FIGHTERS YET</h2>
            <p>Win a fight and save the art to start building your roster.</p>
            <a href="index.html" class="btn btn-primary chamfer">START A FIGHT</a>
          </div>
        </div>
      </div>

      <div class="dex-footer-actions">
        <button id="battledex-clear" type="button" class="btn-text" hidden>[X] CLEAR COLLECTION</button>
      </div>
    </section>
  </main>

  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div class="confirm-frame chamfer">
      <div class="confirm-box chamfer" role="alertdialog" aria-modal="true" aria-labelledby="confirm-heading" aria-describedby="confirm-desc">
        <span class="confirm-eyebrow">WARNING</span>
        <h2 id="confirm-heading" class="confirm-heading">CLEAR YOUR COLLECTION?</h2>
        <p id="confirm-desc">Every saved fighter will be permanently deleted. This can't be undone.</p>
        <div class="confirm-actions">
          <button id="confirm-cancel" type="button" class="btn chamfer">CANCEL</button>
          <button id="confirm-delete" type="button" class="btn btn-danger chamfer">DELETE ALL</button>
        </div>
      </div>
    </div>
  </div>

  <div class="scanlines" aria-hidden="true"></div>

  <script src="battledex-storage.js"></script>
  <script src="battledex.js"></script>
</body>
</html>
